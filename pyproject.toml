[tool.poetry]
name = "cnc-projects"
version = "0.1.0"
description = "AI-assisted parametric CAD for Shapeoko CNC using build123d"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
build123d = "^0.7.0"
cadquery-ocp = "7.7.2"  # build123d 0.7 needs OCP 7.7; 7.8 removed TopoDS_Shape.HashCode
py-lib3mf = "2.3.1"  # 2.4.1 has no macOS arm64 / py3.12 wheel
ocp-vscode = "^2.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = ">=24,<27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
